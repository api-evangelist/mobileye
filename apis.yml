aid: mobileye
name: Mobileye
description: >-
  Mobileye is an Israel-headquartered ADAS and autonomous-driving technology
  company, majority-owned by Intel and publicly traded on NASDAQ as MBLY. Its
  flagship platform is the EyeQ family of purpose-built automotive
  systems-on-chip (EyeQ4, EyeQ5, EyeQ6L, EyeQ6H, EyeQ Ultra), shipped in over
  175 million vehicles worldwide through partnerships with most major OEMs.
  Mobileye's solution portfolio spans entry-level ADAS, Mobileye SuperVision
  (eyes-on, hands-off highway and urban driving), Mobileye Chauffeur (eyes-off
  conditional autonomy), and Mobileye Drive (Level 4 full autonomy in robotaxi
  and goods-delivery applications). The company pioneered Responsibility-
  Sensitive Safety (RSS), a mathematical framework for AV decision safety
  contributed to IEEE standards work, and operates Road Experience Management
  (REM), a crowdsourced HD-mapping system that harvests anonymized road data
  from millions of consumer vehicles to build and update the Mobileye Roadbook.
  Mobileye does not publish a traditional public developer API; OEM and
  integration relationships are private B2B engagements.
